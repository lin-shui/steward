# Descriptive embodiment profile; runtime geometry is built by assets/cobot.py.
# USD supplies arm/lift kinematics. The planar chassis, cameras, contact geometry,
# masses and actuators remain simulation approximations; no wheel dynamics are imported.

id: cobot-magic
display: AgileX Cobot Magic (TRACER 2.0 base + dual Piper + two-camera head)

reference:
  file: robot.usd
  sha256: 7d9ed2f0ce4a40dc3d3a28c80c763661dbd0d33f3684e509d9ee0db7df9b2e49
  prim: /Root/split_aloha_mid_360_with_piper/split_aloha_mid_360_with_piper
  linear_unit_m: 1.0   # Assumption: URDF-sized coordinates; USD omits metersPerUnit (fallback 0.01).
  angular_unit: degree # Converted to radians in the runtime model.
  base_in_steward:
    p: [0.0, 0.0, 0.32052979804575443]
    q: [1, 0, 0, 0]
    calibration: geometric estimate from the lowest wheel mesh point; not measured on hardware
  joint_mapping:
    L_joint1_to_8: fl_joint1_to_8  # Same sign and zero; radians for 1..6, metres for 7..8.
    R_joint1_to_8: fr_joint1_to_8
    lift: lifting_joint          # Steward lift = USD lifting_joint + 0.60 m.
  fixed_mount_rounding: sub-micrometre translations and sub-microradian rotations are treated as zero

mechanical:
  base: planar           # TRACER 2.0 differential drive: position control on x, y, yaw
  chassis:               # MEASURE: envelope from the product sheet; mass and servo gains tuned in sim
    length_m: 0.685
    width_m: 0.570
    height_m: 0.155
    mass_kg: 30
    drive: differential
  torso:
    joint: lift          # prismatic, z
    travel_m: [0.0, 0.60] # displacement above the lowest carriage position
    home_m: 0.0
    origin_in_usd_base_m: [0.22448, 0.0, 1.1147] # USD joint zero is fully raised.
  arms:
    - id: left
      model: piper
      dof: 6             # revolute joint1..joint6, limits in URDF (effort 100)
      mount:             # lifting_link -> arm_base
        p: [0.144, 0.306, 0.138]
        q: [1, 0, 0, 0]
    - id: right
      model: piper
      dof: 6
      mount:
        p: [0.144, -0.306, 0.138]
        q: [1, 0, 0, 0]
  grippers:
    - arm: left
      type: parallel-2f
      control: position  # intermediate aperture valid (joint7/joint8, 0..0.05 m per finger)
      aperture_m: [0.0, 0.10]
    - arm: right
      type: parallel-2f
      control: position
      aperture_m: [0.0, 0.10]
  grasp:
    sim: ideal-attach    # Phase-0 style capture; swap for physical closure before sim2real acceptance
    real: physical-closure
    tcp_in_link6_m: [0.0, 0.0, 0.13503] # Operational finger-plane TCP; not factory-calibrated.
  leader_arms: 2         # teleoperation only; autonomy uses the two follower arms

sensors:
  # The mobile kitchen robot's head (generators.head_link) on a mast fixed to the chassis, so both
  # bodies perceive alike and either one can take any scenario. MEASURE: the real Orbbec mounts.
  cameras:
    - id: head_camera
      kind: rgbd
      mount_link: head    # head fixed on the chassis at [0.16, 0, 1.50]; does not ride the lift
      mount: {p: [0.05, 0, 0], pitch_deg: 30}
      intrinsics: {width: 320, height: 240, fovy: 60}
      role: survey
    - id: wide_camera
      kind: rgbd
      mount_link: head
      mount: {p: [0.05, 0, -0.05], pitch_deg: 45}
      intrinsics: {width: 480, height: 360, fovy: 100}
      role: work          # sees both arms' workspace down to the chassis front
  visibility_contract:
    sees_own_gripper: wide_camera (work view); head_camera (survey view) loses the hands at a tabletop pick
    near_field_blind: arms in front of the head -> FK-projection self-filter
    invisible_materials: transparent glass (Astra structured light + SAM3 both fail; task subset avoids)

self_model:
  kinematics: {source: robot.usd, implementation: src/steward/assets/cobot.py, sim: mjcf-converted}
  ik: {solver: mink, note: "6-DoF; PyRoki rejects 6-DoF (YAM precedent)"}   # ASPIRE yam_real is the porting reference
  collision: primitive approximation per link; fingers visual-only
  camera_fk: any-link FK chain (head fixed on the chassis)
  actuator: position control, joint velocity limits MEASURE from Piper spec

control_face:            # what EH sees; implementation per backend
  verbs: [approach, pick, place, push, open_drawer, close, press]
  primitives: [move_to_pose(arm), move_to_joints(arm), move_synchronized, set_gripper(aperture)]
  rates_hz: {sim: 20, real: 30}      # MEASURE real: piper control loop

execution_stack:         # all services run locally on the agilex workstation RTX 4090
  sam3: {url: "http://127.0.0.1:8117", note: realseg_service recipe}
  graspnet: {url: "http://127.0.0.1:8115", note: contact grasps, not centroid}
  planning: mink + joint interpolation  # cuRobo optional later

sim2real:
  real_backend: piper_sdk   # pip package, SocketCAN can0 @1Mbps; no ROS dependency
  safety: [hardware e-stop REQUIRED before any motion, '"--allow-motion" software interlock', joint velocity caps]
  calibration: [head camera intrinsics, head-to-arm extrinsics, arm mount transforms]  # MEASURE, replaces placeholders above
  observer_gt: apriltag + head camera
  wh_role: operator console; human perturbations

tasks:
  sim: cobot-table scenario; LIBERO-style tabletop set (pick-place, drawer, stacking) on this twin
  real: the same task set, Phase-5 acceptance "same EH bundle, no code change"
