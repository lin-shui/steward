# Ego Harness layer. Override `steward-ego-runtime.config.endpoint` in the robot profile's
# cordis.patch.yml when the Ego API is not on the default port (one profile per robot).
- insert:
    - id: steward-ego-runtime
      name: '@steward/dsh-ego-runtime-client'
      config:
        endpoint: 'http://127.0.0.1:7420'
        timeoutMs: 15000
    - id: steward-tool-ego
      name: '@steward/dsh-tool-ego'
    - id: steward-robot-safety
      name: '@steward/dsh-robot-safety'
      config:
        maxRisk: 0.35
    # The console prefixes every operator message with this marker (steward.world.chat).
    - id: steward-ego-reflection
      name: '@steward/dsh-ego-reflection'
      config:
        instructionMarker: '操作员任务：'
        # A routine step after a program thinks briefly; a new instruction, a failure and every
        # reflection think long, a deep reflection longest.
        effort:
          act: low
          instruction: high
          recover: high
          shallow: high
          deep: max
          checkpoint: high
    - id: steward-tool-ego-capabilities
      name: '@steward/dsh-tool-ego-capabilities'
      config:
        root: !!js "(process.env.DSH_HOME ?? process.env.HOME + '/.dsh') + '/steward-capabilities'"

# The model calls tools from TypeScript programs (run_code): it composes the robot tools into new
# behaviour for tasks no single tool covers, and saves what worked as capabilities. Programs run in
# the shared sandbox and reach the robot only through the same tools and safety policy.
- id: tools
  config:
    mode: ptc

# Helper functions and variables a program declares stay in memory for the later programs of the
# same Harness process (one console turn), so a step does not rewrite them. One program runs a
# whole sequence of robot steps in a loop, so its deadline covers minutes of robot motion.
- id: ptc-runtime
  config:
    executionMode: persistent-in-memory
    timeoutMs: 300000
    maxTimeoutMs: 600000

# The robot perceives and acts only through ctx.ego. General computer tools inherited from
# dsh-base would let the model run commands, read files (including simulator data holding
# World State) or browse the web, bypassing the Ego-State boundary.
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-jobs
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-web
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-working-directory
  disabled: true
