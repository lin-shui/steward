<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Steward 控制台</title>
<style>
  :root { --bg: #0f1216; --card: #171b21; --line: #2a313a; --text: #dde3ea; --muted: #8b96a3; --ego: #ff9f43; --gt: #4aa3ff; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
         background: var(--bg); color: var(--text); }
  header { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 10px 16px;
           border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 3; }
  header h1 { font-size: 16px; margin: 0 12px 0 0; font-weight: 600; }
  header .spacer { flex: 1; }
  button, select { background: #222831; color: var(--text); border: 1px solid var(--line); border-radius: 6px;
                   padding: 5px 10px; font: inherit; cursor: pointer; }
  button:hover { border-color: #3c4652; }
  button.on { border-color: var(--ego); color: #ffd2a6; }
  .pill { padding: 2px 8px; border-radius: 999px; background: #222831; color: var(--muted); font-variant-numeric: tabular-nums; }
  .wrap { padding: 14px 16px; display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; }
  .card h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; display: flex; flex-wrap: wrap;
             gap: 8px; align-items: center; }
  .card h2 .spacer { flex: 1; }
  .panes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .pane-title { font-size: 13px; margin-bottom: 6px; display: flex; gap: 8px; align-items: center; }
  .pane-title .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .pane-title .sub { color: var(--muted); font-size: 12px; }
  .viewport { position: relative; border-radius: 8px; overflow: hidden; background: #11151a; aspect-ratio: 4 / 3;
              cursor: grab; user-select: none; touch-action: none; }
  .viewport.dragging { cursor: grabbing; }
  .viewport img, .viewport canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .viewport img:not([src]) { visibility: hidden; }
  .viewport .empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .hint { position: absolute; right: 10px; bottom: 8px; font-size: 12px; color: #c3ccd6aa; pointer-events: none; }
  .grid3 { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .grid3 { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 820px) { .panes, .grid3 { grid-template-columns: 1fr; } }
  canvas.plain { width: 100%; display: block; border-radius: 6px; background: #11151a; }
  .cam img { width: 100%; border-radius: 6px; background: #11151a; aspect-ratio: 4 / 3; object-fit: cover; display: block; }
  .cam img:not([src]) { visibility: hidden; }
  .cam + .cam { margin-top: 10px; }
  .cam .caption { font-size: 12px; color: var(--muted); margin: 0 0 4px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 3px 0; border-bottom: 1px solid #20262e; }
  td:last-child { text-align: right; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; color: var(--muted); font-size: 12px; margin-top: 8px; }
  .legend label { display: inline-flex; gap: 5px; align-items: center; cursor: pointer; }
  .events { max-height: 140px; overflow: auto; font-size: 12px; color: var(--muted); margin: 8px 0 0; padding-left: 18px; }
  .task { color: var(--muted); }
  .err { color: #ff6b6b; }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 14px; align-items: stretch; }
  @media (max-width: 1300px) { .top { grid-template-columns: 1fr; } .chat { height: 560px; } }
  .chat { display: flex; flex-direction: column; min-height: 0; }
  .chat .msgs { flex: 1 1 0; min-height: 200px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px;
                padding: 4px 2px 8px; }
  .msg { max-width: 92%; padding: 7px 10px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: #1f3a5c; }
  .msg.user.robot { background: #4a3218; }
  .msg.assistant { align-self: flex-start; background: #232a33; border-left: 3px solid var(--gt); }
  .msg.assistant.robot { border-left-color: var(--ego); }
  .msg .who { display: block; font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  .tool.world summary::before { content: '● '; color: var(--gt); }
  .tool.robot summary::before { content: '● '; color: var(--ego); }
  .targets { display: flex; gap: 6px; margin-bottom: 6px; }
  .targets button { flex: 1; font-size: 12px; }
  .targets button.on.world { border-color: var(--gt); color: #cfe6ff; }
  .targets button.on.robot { border-color: var(--ego); color: #ffd2a6; }
  .msg.error { align-self: stretch; background: #3a1f24; color: #ffb3b3; font-size: 12px; }
  .msg.system { align-self: center; color: var(--muted); font-size: 12px; padding: 2px; }
  .tool { align-self: flex-start; font-size: 12px; color: var(--muted); max-width: 100%; }
  .tool summary { cursor: pointer; list-style: none; }
  .tool summary::-webkit-details-marker { display: none; }
  .tool .ok { color: #3ecf8e; } .tool .bad { color: #ff6b6b; } .tool .run { color: var(--ego); }
  .tool pre { margin: 4px 0 0; padding: 6px 8px; background: #11151a; border-radius: 6px; max-height: 180px; overflow: auto;
              white-space: pre-wrap; word-break: break-all; font-size: 11px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chips button { font-size: 12px; padding: 3px 8px; color: var(--muted); }
  .composer { display: flex; gap: 8px; align-items: flex-end; }
  .composer textarea { flex: 1; resize: none; height: 58px; background: #11151a; color: var(--text); border: 1px solid var(--line);
                       border-radius: 8px; padding: 7px 9px; font: inherit; }
  .composer textarea:focus { outline: none; border-color: #3c4652; }
  .composer button { height: 58px; }
  button:disabled { opacity: .5; cursor: default; }
  @keyframes alertOutline { 0%, 100% { outline-color: #ff4d4d; } 50% { outline-color: #ff4d4d33; } }
  .robot-status { margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; background: #11151a; padding: 8px 10px;
                  font-size: 12.5px; }
  .rs-now div { margin: 1px 0; } .rs-now .label { color: var(--muted); }
  .alert-ack { border-color: #ff6b6b; color: #ffb3b3; }
  .alert-ack[hidden] { display: none; }
  .rs-history { height: 240px; min-height: 80px; resize: vertical; overflow-y: auto; margin-top: 6px; border-top: 1px solid #20262e; padding-top: 4px;
                font-variant-numeric: tabular-nums; }
  .rs-history .row { display: flex; gap: 6px; padding: 1px 0; align-items: baseline; }
  .rs-history .t { color: var(--muted); min-width: 62px; }
  .rs-history .k { min-width: 30px; font-size: 11px; color: var(--muted); }
  .rs-history .row.step .k { color: #8fc7ff; } .rs-history .row.skill .k { color: #b8c4d0; }
  .rs-history .row.difficulty .k, .rs-history .row.difficulty .x { color: #ffd27a; }
  .rs-history .row.state .k { color: #c8a6ff; } .rs-history .row.alert .k, .rs-history .row.alert .x { color: #ff8a8a; }
  .rs-history .x { white-space: pre-wrap; word-break: break-word; }
  .rs-history .row.reflection .k, .rs-history .row.reflection .x { color: #7fe0c4; }
  .rs-history .row.think .k { color: #e6b3ff; } .rs-history .row.think .x { color: #d8d0e0; }
  .viewport.alerting { outline: 3px solid #ff4d4d; outline-offset: -3px; animation: alertOutline 1.1s ease-in-out infinite; }
  @keyframes alertTint { 0%, 100% { background: rgba(225, 30, 30, 0.38); } 50% { background: rgba(225, 30, 30, 0.04); } }
  .viewport.alerting::after { content: ''; position: absolute; inset: 0; pointer-events: none;
                              animation: alertTint 1.1s ease-in-out infinite; }
  .card h2 .sub { color: var(--muted); font-weight: 400; font-size: 12px; }
  .plan-goal { font-size: 14px; margin-bottom: 8px; }
  .plan-steps { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .plan-step { padding: 4px 10px; border-radius: 8px; border: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .plan-step.done { border-color: #2f7a57; color: #8fe0b8; }
  .plan-step.active { border-color: var(--ego); color: #ffd2a6; background: #2d2215; }
  .plan-step.failed { border-color: #a33a3a; color: #ffb3b3; }
  .plan-now { font-size: 13px; }
  .plan-now .label { color: var(--muted); }
  .plan-wait { margin-top: 8px; padding: 6px 10px; border-radius: 8px; border: 1px solid #2a3340; background: #151a21;
               font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px;
               font-variant-numeric: tabular-nums; }
  .plan-wait .label { color: var(--muted); }
  .plan-wait .bar { color: #9cd0ff; white-space: pre; }
  .plan-wait.llm .bar { color: #c8a6ff; }
  .plan-wait.run_code .bar { color: #8fe0b8; }
  .plan-trouble { margin-top: 8px; padding: 6px 10px; border-radius: 8px; background: #33270f; color: #ffd27a; font-size: 13px;
                  white-space: pre-wrap; word-break: break-word; }
  .plan-trouble.stuck { background: #3a1f24; color: #ffb3b3; }
  .pill.running { color: #8fe0b8; } .pill.recovering, .pill.escaping { color: #ffd27a; } .pill.waiting-operator { color: #ff8a8a; }
</style>
</head>
<body>
<header>
  <h1>Steward 控制台</h1>
  <select id="body" title="本体：这台机器人是哪种身体，与场景无关；加载时生效，换本体会重开 Episode 并换掉机器人运行时"></select>
  <select id="scenario" title="Scenario：房间、物体和任务；用左边所选的本体加载"></select>
  <button id="load">加载</button>
  <button id="reset">重置</button>
  <button id="pause">暂停</button>
  <select id="speed" title="仿真倍速">
    <option value="0.5">0.5×</option><option value="1">1×</option><option value="2">2×</option>
    <option value="4">4×</option><option value="8">8×</option><option value="max">最快</option>
  </select>
  <select id="phase" title="功能级别：系统各模块运行在哪个 Phase 的实现上；运行中可切换，用于对比与调试"></select>
  <select id="fps" title="渲染帧率：世界视图（主机渲染线程）与自我态视图（机器人端渲染线程）按同一帧时钟以此帧率渲染；机器人相机按此帧率请求；控制台状态刷新最多每秒 5 次">
    <option value="25">25 fps</option><option value="10">10 fps</option><option value="5">5 fps</option>
    <option value="3">3 fps</option><option value="1">1 fps</option>
  </select>
  <span class="pill" id="clock">t = –</span>
  <span class="task" id="task"></span>
  <span class="spacer"></span>
  <span class="err" id="error"></span>
</header>
<div class="wrap">
  <div class="top">
  <section class="card">
    <h2>
      斜视主视图（两个面板共用同一相机）
      <span class="spacer"></span>
      <button data-view="south" class="on">斜上方·南</button>
      <button data-view="southeast">斜上方·东南</button>
      <button data-view="southwest">斜上方·西南</button>
      <button data-view="top">正上方</button>
    </h2>
    <div class="panes">
      <div>
        <div class="pane-title"><span class="dot" style="background:var(--gt)"></span>World State
          <span class="sub" id="fpsWorld"></span>
          <span class="sub">世界真实状态（WSim 渲染）</span></div>
        <div class="viewport" id="vpWorld">
          <img id="imgWorld" alt="World State">
          <canvas id="ovWorld" width="1024" height="768"></canvas>
          <div class="hint">拖动旋转 · 滚轮缩放</div>
        </div>
      </div>
      <div>
        <div class="pane-title"><span class="dot" style="background:var(--ego)"></span>Ego State
          <span class="sub" id="egoSub">机器人自我态（同一转换器渲染）</span><span class="sub" id="fpsEgo"></span></div>
        <div class="viewport" id="vpEgo">
          <img id="imgEgo" alt="Ego State">
          <canvas id="ovEgo" width="1024" height="768"></canvas>
          <div class="empty" id="egoEmpty">尚未收到机器人的自我态</div>
          <div class="hint">拖动旋转 · 滚轮缩放</div>
        </div>
        <div class="robot-status" id="robotStatus">
          <div class="rs-now" id="rsNow">机器人尚未发布计划</div>
          <div class="rs-history" id="rsHistory"></div>
        </div>
      </div>
    </div>
    <div class="legend">
      <label><input type="checkbox" id="showGtLabels" checked>World：物体标签</label>
      <label><input type="checkbox" id="showEgoLabels" checked>Ego：物体标签</label>
      <label><input type="checkbox" id="showSigma" checked>Ego：2σ 不确定度</label>
      <label><input type="checkbox" id="showError" checked>Ego：到真实位置的误差线</label>
    </div>
  </section>
  <section class="card chat">
    <h2>操作员对话 <span class="pill" id="chatStatus"></span>
      <span class="spacer"></span><button id="egoAlertAck" class="alert-ack" hidden title="确认当前告警：Ego State 窗口停止闪烁，被监测暂停的仿真继续">解除告警</button><button id="chatStop" title="停止当前目标的本轮任务">停止</button><button id="chatReset">新会话</button></h2>
    <div class="targets">
      <button data-target="world" class="on world">世界 · World Harness</button>
      <button data-target="robot" class="robot">机器人</button>
    </div>
    <div class="msgs" id="chatMsgs"></div>
    <div class="chips" id="chatChips"></div>
    <div class="composer">
      <textarea id="chatInput"></textarea>
      <button id="chatSend">发送</button>
    </div>
  </section>
  </div>
  <div class="grid3">
    <section class="card">
      <h2 id="robotCamLabel">机器人相机</h2>
      <div class="cam"><p class="caption" id="camCaption-head_camera">头部相机 · 看前方（垂直视野 60°，俯 30°）</p>
        <img id="camRobot-head_camera" alt="头部相机"></div>
      <div class="cam"><p class="caption" id="camCaption-wide_camera">广角相机 · 短焦，看身前台面与夹爪（垂直视野 100°，俯 45°）</p>
        <img id="camRobot-wide_camera" alt="广角相机"></div>
    </section>
    <section class="card">
      <h2>俯视地图（蓝：真实状态　橙：自我态）</h2>
      <canvas class="plain" id="map" width="700" height="560"></canvas>
    </section>
    <section class="card">
      <h2>Observer 指标</h2>
      <table id="metrics"></table>
      <canvas class="plain" id="chart" width="700" height="150" style="margin-top:10px"></canvas>
      <h2 style="margin-top:12px">事件</h2>
      <ol class="events" id="events"></ol>
    </section>
  </div>
  <section class="card" id="planCard">
    <h2>机器人计划 <span class="pill" id="planState"></span><span class="sub" id="planMeta"></span></h2>
    <div id="planBody" class="task">机器人尚未发布计划</div>
    <h2 style="margin-top:14px">当前思考 <span class="sub" id="thinkMeta"></span></h2>
    <div id="thinkBody" class="task" style="white-space:pre-wrap"></div>
  </section>
</div>
<script>
const $ = (id) => document.getElementById(id);
// Text stays selectable and copyable while the console refreshes: a box is rewritten only when its
// content changes, and not while the pointer is held in it or a selection touches it, because a
// rewrite drops the selection.
let pressed = null;
document.addEventListener('pointerdown', (e) => { pressed = e.target; });
document.addEventListener('pointerup', () => { pressed = null; });
window.addEventListener('blur', () => { pressed = null; });
function selecting(el) {
  if (pressed && (el.contains(pressed) || pressed.contains(el))) return true;
  const sel = getSelection();
  return !!sel && !sel.isCollapsed && sel.containsNode(el, true);
}
const shownHtml = new WeakMap();
function setText(el, text) {
  if (el.textContent === text || selecting(el)) return false;
  el.textContent = text;
  shownHtml.delete(el);
  return true;
}
function setHtml(el, html) {
  if (shownHtml.get(el) === html || selecting(el)) return false;
  el.innerHTML = html;
  shownHtml.set(el, html);
  return true;
}
const COLORS = { table: '#c9a46b', counter: '#8a6a4a', cabinet: '#a07850', sideboard: '#b08860', cup: '#7fd3ff',
  bowl: '#e8e8ea', plate: '#f2f2f2', 'steward-bot': '#4aa3ff', wall: '#5b6570', floor: '#1c2128', drawer: '#ccab80',
  wine_glass: '#cfeaf7', mug: '#2a2a2e', teddy_bear: '#94613a', scissors: '#b5b8bf', toy_airplane: '#f2c71a',
  pistol: '#1f1f22', pill_bottle: '#f0f0ea', perfume_bottle: '#f29abf' };
const NAMES = { table: '餐桌', counter: '操作台', cabinet: '柜子', sideboard: '餐边柜', cup: '杯子', bowl: '碗',
  plate: '盘子', 'steward-bot': '机器人', drawer: '抽屉', wine_glass: '高脚杯', mug: '咖啡杯', teddy_bear: '玩具熊',
  scissors: '剪刀', chair: '椅子', unknown: '未知物体', toy_airplane: '玩具飞机', pistol: '手枪', pill_bottle: '药瓶', perfume_bottle: '香水瓶' };
const COLOR_NAMES = { red: '红', green: '绿', blue: '蓝', black: '黑', white: '白', gray: '灰', clear: '透明' };
const TABLEWARE = new Set(['bowl', 'cup', 'mug', 'plate', 'wine_glass']);
const RENDER_W = 1024, RENDER_H = 768;
let state = null, robotId = null, view = null, viewKey = '';
const panes = {
  world: { img: 'imgWorld', overlay: 'ovWorld', label: 'fpsWorld', rendered: null, busy: false, shown: null, index: null },
  ego: { img: 'imgEgo', overlay: 'ovEgo', label: 'fpsEgo', rendered: null, busy: false, shown: null, index: null },
};

// -------------------------------------------------------------- frame rate
const FPS_KEY = 'steward.console.fps';
const FPS_CHOICES = [25, 10, 5, 3, 1];
let fps = FPS_CHOICES.includes(Number(localStorage.getItem(FPS_KEY))) ? Number(localStorage.getItem(FPS_KEY)) : 10;
const sleep = (ms) => new Promise(r => setTimeout(r, ms));
function rateMeter() {
  const frames = [];
  return () => {
    const now = performance.now();
    frames.push(now);
    while (frames.length && frames[0] < now - 3000) frames.shift();
    return frames.length > 1 ? (frames.length - 1) * 1000 / (now - frames[0]) : 0;
  };
}
async function ticked(task) {
  // Fetch just after each tick of the shared frame clock (tick k at k / fps s of Unix time), when
  // both renderers have produced frame k.
  for (;;) {
    const now = Date.now() / 1000, next = (Math.floor(now * fps) + 1) / fps;
    await sleep((next - now) * 1000 + Math.min(60, 300 / fps));
    if (!document.hidden) {
      try { await task(); } catch (e) { /* a failed fetch is retried on the next tick */ }
    }
  }
}
async function paced(task, rate) {
  let due = performance.now();
  for (;;) {
    if (!document.hidden) {
      try { await task(); } catch (e) { /* a failed frame is retried on the next tick */ }
    }
    const period = 1000 / rate();
    due = Math.max(due + period, performance.now() - period);
    await sleep(Math.max(0, due - performance.now()));
  }
}
async function showBlob(img, res, previous) {
  const url = URL.createObjectURL(await res.blob());
  const next = new Image();
  next.src = url;
  await next.decode();
  img.src = url;
  if (previous) URL.revokeObjectURL(previous);
  return url;
}

async function api(method, path, body) {
  const res = await fetch(path, { method, headers: { 'content-type': 'application/json' },
    body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
  return data;
}
function showError(e) { setText($('error'), e ? String(e.message || e) : ''); }

// ------------------------------------------------------------------ camera
const rad = (d) => d * Math.PI / 180;
function presetView(name) {
  const base = state.view;
  const preset = { south: [90, -50], southeast: [135, -45], southwest: [45, -45], top: [90, -89] }[name];
  return { ...base, azimuth: preset[0], elevation: preset[1], distance: name === 'top' ? base.distance * 1.05 : base.distance };
}
function cameraFrame(cam) {
  const az = rad(cam.azimuth), el = rad(cam.elevation);
  const fwd = [Math.cos(el) * Math.cos(az), Math.cos(el) * Math.sin(az), Math.sin(el)];
  const up = [-Math.cos(az) * Math.sin(el), -Math.sin(az) * Math.sin(el), Math.cos(el)];
  const right = [fwd[1] * up[2] - fwd[2] * up[1], fwd[2] * up[0] - fwd[0] * up[2], fwd[0] * up[1] - fwd[1] * up[0]];
  const pos = cam.lookat.map((v, i) => v - cam.distance * fwd[i]);
  return { fwd, up, right, pos, f: (RENDER_H / 2) / Math.tan(rad(cam.fovy) / 2) };
}
function project(frame, p) {

// ------------------------------------------------------------------ top map
function drawMap() {
  const cv = $('map'), ctx = cv.getContext('2d');
  const floor = state.groundTruth.find(g => g.category === 'floor');
  const b = floor ? { cx: floor.center[0], cy: floor.center[1], w: floor.size[0] + 0.6, h: floor.size[1] + 0.6 } : { cx: 0, cy: 0, w: 8, h: 6 };

  }

  if (ego) {

const ACTIVITY_KINDS = { step: '步骤', skill: '技能', difficulty: '困难', state: '状态', alert: '告警', reflection: '反思', think: '思考' };

function renderRobotStatus(chat) {

  const robot = chat.agents.robot || {};
  const view = robot.plan, todos = agentTodos(chat);
  const plan = view && view.plan;
  const skill = view && view.skill ? `${view.skill.skill}（已执行 ${Math.max(0, view.t - view.skill.started).toFixed(0)} s）` : '无';
  let macro = '–', micro = '–';
  if (todos) {
    const active = todos.find(t => t.status === 'in_progress');
    macro = `操作员任务：${active ? active.content : '（无进行中的待办）'}`;
  } else if (plan) {
    const active = plan.steps.find(st => st.status === 'active') || plan.steps.find(st => st.status === 'failed');
    macro = `${active ? active.name : plan.goal}${plan.round ? `（第 ${plan.round} 轮` : '（'}· ${PLAN_STATES[plan.state] || plan.state}）`;
    micro = plan.current || '–';

    + `<div><span class="label">微观步骤：</span>${esc(micro)}</div><div><span class="label">技能：</span>${esc(skill)}</div>${wait}`

$('fps').value = String(fps);
$('fps').onchange = () => {
  fps = Number($('fps').value); localStorage.setItem(FPS_KEY, String(fps));
  panes.world.index = panes.ego.index = null;  // tick numbers restart at a new rate
  postView();
};
refresh().then(loadScenarios);
paced(refresh, () => Math.min(fps, 5));
ticked(() => pullFrame('world'));
ticked(() => pullFrame('ego'));
setInterval(postView, 5000);
paced(refreshRobotCamera, () => fps);
refreshChat();
setInterval(refreshChat, 800);
</script>
</body>
